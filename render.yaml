services:
  - type: web
    name: bookleaf-portal-backend
    env: python
    region: oregon
    plan: free
    branch: master
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "720"
      - key: BACKEND_CORS_ORIGINS
        value: "*"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: AI_TIMEOUT_SECONDS
        value: "20"
      - key: ENABLE_DEMO_BOOTSTRAP
        value: "True"
      - key: ADMIN_EMAIL
        value: admin@bookleaf.com
      - key: ADMIN_PASSWORD
        value: AdminSecure@2026
      - key: DEMO_AUTHOR_PASSWORD
        value: AuthorDemo@2026
